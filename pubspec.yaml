name: bigger_brew_kiosk
description: Bigger Brew standalone customer ordering kiosk.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  pdf: ^3.12.0
  printing: ^5.14.3
  print_bluetooth_thermal: ^1.2.2
  permission_handler: ^12.0.3
  excel: ^4.0.6
  file_picker: ^12.0.0
  flutter_email_sender: ^8.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/product_catalog.v4.commercial.json
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/bigger_brew_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/bigger_brew_icon.png
